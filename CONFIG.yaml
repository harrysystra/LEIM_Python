general:
# Allowed Values: True or False 
  run_step2: False
  run_step3: True
  run_step4: True

  test_code: "ft"
  years: [2031] # For Steps 3 and 4 - Step 2 years configured seperately in the below step2_config section
  scenarios: ['Low', 'Behavioural','High'] # List all scenarios except Core 
  geodef_path: "Inputs//Step2//geodef_GISCorrect.csv"


step2_config:
  input_directory: "Inputs//Step2"
  output_directory: "Outputs//Step2"
  years: ['2019', '2026', '2031', '2036', '2046']
  scenarios: ['Core', 'Low', 'Behavioural','High'] # Core should be always first in the list to allow other runs to produce comparison files!


step3_config:
  input_directory: "Inputs//Step3"
  output_directory: "Outputs//Step3"
  export_csv: True
  export_dat: True
  activity_class_path: "Inputs//Step3//activity_classifications.csv"


step4_config:
  input_directory: "Inputs//Step4"
  output_directory: "Outputs//Step4"  
  export_csv: True
  export_dat: True

  max_iterations: 10
  tolerance: 0.1